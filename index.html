<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TechFix Forum | Cellphone Repair Community</title>
    <style>
        :root {
            --blue-main: #2563eb; 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --nav-bg: rgba(30, 30, 30, 0.95);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
            --radius-md: 10px;
        }

        /* Role Colors */
        .role-new { color: #4ade80 !important; }        /* Green */
        .role-member { color: #60a5fa !important; }     /* Blue */
        .role-elite { color: #a855f7 !important; }      /* Violet */
        .role-contributor { color: #fbbf24 !important; }/* Gold */
        .role-admin { color: #ef4444 !important; }      /* Red */

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        nav { background: var(--nav-bg); padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 16px; }
        .hamburger { font-size: 1.5rem; color: var(--text-muted); cursor: pointer; background: none; border: none; }
        .logo { font-size: 1.2rem; font-weight: 800; color: white; }
        .auth-controls button { background: var(--blue-main); color: white; border: none; padding: 8px 16px; border-radius: 50px; font-weight: 600; cursor: pointer; }
        .user-menu-trigger { cursor: pointer; background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 50px; font-weight: 600; }

        .side-nav { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background-color: var(--card-bg); z-index: 150; transition: left 0.3s; padding: 20px; overflow-y: auto; border-right: 1px solid var(--border); }
        .side-nav.active { left: 0; }
        .side-nav-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 140; }
        .side-nav-overlay.active { display: block; }
        .side-nav-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .side-nav-close { background: none; border: none; font-size: 1.5rem; color: white; cursor: pointer; }
        .side-nav-item { padding: 12px; border-radius: 8px; cursor: pointer; color: var(--text-muted); }
        .side-nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--blue-main); font-weight: 800; margin: 15px 0 5px 10px; }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; flex: 1; width: 100%; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-bar { flex: 1; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--card-bg); color: white; outline: none; }
        .btn-post { background: white; color: black; padding: 10px 20px; border-radius: var(--radius-md); font-weight: bold; border: none; cursor: pointer; }

        #thread-list { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border); position: relative; }
        .card-title { font-size: 1.2rem; margin-bottom: 10px; }
        .card-body { color: var(--text-muted); line-height: 1.5; margin-bottom: 15px; }
        .card-footer { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 10px; align-items: center; }
        
        .hidden-block { background: rgba(0,0,0,0.4); border: 1px dashed var(--border); padding: 15px; text-align: center; border-radius: 8px; margin: 10px 0; color: #f87171; font-weight: 600; }
        .btn-react { background: transparent; border: 1px solid var(--blue-main); color: var(--blue-main); padding: 4px 10px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .btn-react.reacted { background: var(--blue-main); color: white; }
        .btn-edit { background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); padding: 4px 10px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; margin-left: 10px; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 200; padding: 15px; overflow-y: auto; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 450px; padding: 20px; border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 12px; margin: auto; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 5px; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: white; cursor: pointer; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border); color: white; border-radius: 8px; margin-top: 5px; }
        .btn-submit { background: var(--blue-main); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }

        /* Profile Modal Styles */
        .upc-header { text-align: center; padding: 10px 0; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
        .upc-avatar { width: 70px; height: 70px; border-radius: 50%; background: #333; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; overflow: hidden; background-size: cover; background-position: center; }
        .upc-avatar.clickable { cursor: pointer; border: 2px dashed var(--blue-main); }
        .upc-name { font-size: 1.2rem; font-weight: 800; }
        .upc-role { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
        .upc-stats { display: flex; justify-content: space-around; font-size: 0.85rem; text-align: center; }
        .upc-stats b { display: block; font-size: 1rem; color: white; }
        .profile-section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--blue-main); font-weight: 800; margin-top: 10px; margin-bottom: 2px; }

        /* Admin Panel Styles */
        .admin-user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); margin-bottom: 5px; border-radius: 5px; }
        .admin-user-row select { background: var(--bg-color); color: white; border: 1px solid var(--border); padding: 4px; border-radius: 4px; }
        .btn-limit { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-limit.limited { background: #10b981; }
        
        .advanced-options { display: none; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-top: 5px; border: 1px solid var(--border); }
        .advanced-options label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; margin-bottom: 5px; }
        
        footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.9rem; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <button class="hamburger" onclick="toggleSideNav()">☰</button>
            <div class="logo">TechFix</div>
        </div>
        <div class="nav-right" id="auth-controls"></div>
    </nav>

    <div class="side-nav" id="sideNav">
        <div class="side-nav-header">
            <div class="logo">Menu</div>
            <button class="side-nav-close" onclick="toggleSideNav()">&times;</button>
        </div>
        <div class="nav-section-title">Navigation</div>
        <div class="side-nav-item" onclick="toggleSideNav()">🏠 Home</div>
        
        <div id="eliteLoungeNav" style="display:none;">
            <div class="nav-section-title">Exclusive</div>
            <div class="side-nav-item role-elite">💎 Elite & Contributor Lounge</div>
        </div>

        <div id="adminPanelNav" style="display:none;">
            <div class="nav-section-title">Administration</div>
            <div class="side-nav-item role-admin" onclick="openAdminPanel()">⚙️ Admin Panel</div>
        </div>
    </div>
    <div class="side-nav-overlay" id="sideNavOverlay" onclick="toggleSideNav()"></div>

    <div class="container">
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-bar" placeholder="Search discussions..." onkeyup="renderThreads()">
            <button class="btn-post" onclick="openNewThread()">+ Post</button>
        </div>
        <div id="thread-list">
            <div style="text-align:center; color:gray;">Loading discussions...</div>
        </div>
    </div>

    <footer>Made By Ismael Manongdo</footer>

    <!-- Auth Modals -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="authTitle">Log In</h2>
                <button class="modal-close" onclick="closeModals()">&times;</button>
            </div>
            
            <div class="form-group"><input type="email" id="authEmail" placeholder="Email Address"></div>
            <div class="form-group" id="usernameGroup" style="display:none;">
                <input type="text" id="authUser" placeholder="Display Name (Username)">
            </div>
            <div class="form-group"><input type="password" id="authPass" placeholder="Password"></div>
            
            <button class="btn-submit" onclick="submitAuth()" id="authBtn">Log In</button>
            <div style="text-align:center; margin-top:10px; font-size:0.9rem;">
                <a href="#" style="color:var(--blue-main);" onclick="toggleAuthMode()">Switch to Register/Login</a>
            </div>
        </div>
    </div>

    <!-- Profile Modal (With Security Settings) -->
    <div class="modal" id="profileModal" onclick="if(event.target===this)closeModals()">
        <div class="modal-content" style="max-width: 380px;">
            <div class="modal-header">
                <h2>User Profile</h2>
                <button class="modal-close" onclick="closeModals()">&times;</button>
            </div>
            <div class="upc-header">
                <div class="upc-avatar" id="upcAvatar" title="Click to change avatar"></div>
                <input type="file" id="avatarUpload" style="display:none;" accept="image/*" onchange="handleAvatarUpload(event)">
                <div class="upc-name" id="upcName"></div>
                <div class="upc-role" id="upcRole"></div>
                <div class="upc-stats">
                    <div><b id="statPosts">0</b>Posts</div>
                    <div><b id="statReacts">0</b>Reactions</div>
                    <div><b id="statPoints">0</b>Points</div>
                </div>
            </div>

            <!-- Security Options -->
            <div class="profile-section-title">Security Settings</div>
            <div class="form-group" style="margin-top:2px;">
                <label style="font-size:0.8rem; color:var(--text-muted);">Change Username</label>
                <input type="text" id="newUsernameInput" placeholder="New username">
                <button class="btn-submit" style="padding:6px; font-size:0.85rem; margin-top:4px;" onclick="updateUsername()">Update Username</button>
            </div>
            <div class="form-group" style="margin-top:5px;">
                <label style="font-size:0.8rem; color:var(--text-muted);">Change Password</label>
                <input type="password" id="newPasswordInput" placeholder="New password (min 6 chars)">
                <button class="btn-submit" style="padding:6px; font-size:0.85rem; margin-top:4px; background:#059669;" onclick="updatePassword()">Update Password</button>
            </div>

            <button class="btn-submit" style="background:#ef4444; margin-top:15px;" onclick="logout()">Log Out</button>
        </div>
    </div>

    <!-- Thread Creator/Editor -->
    <div class="modal" id="threadModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="threadModalTitle">Create Thread</h2>
                <button class="modal-close" onclick="closeModals()">&times;</button>
            </div>
            <input type="hidden" id="editThreadId" value="">
            <div class="form-group"><input type="text" id="postTitle" placeholder="Title"></div>
            <div class="form-group"><textarea id="postContent" placeholder="Content..." rows="6"></textarea></div>
            
            <div id="advancedOptions" class="advanced-options">
                <label><input type="checkbox" id="checkSpoiler"> Hide Content (Spoiler - Members+ Only)</label>
                <label><input type="checkbox" id="checkReaction"> Require Reaction to View</label>
            </div>

            <button class="btn-submit" onclick="submitThread()">Save Thread</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2>Admin Control Panel</h2>
                <button class="modal-close" onclick="closeModals()">&times;</button>
            </div>
            <div id="adminUserList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- FIREBASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDEAFqROiqVnWgugCLUad_IuCjsz5Wd38w",
            authDomain: "techfix-app-c8792.firebaseapp.com",
            projectId: "techfix-app-c8792",
            storageBucket: "techfix-app-c8792.firebasestorage.app",
            messagingSenderId: "108014501959",
            appId: "1:108014501959:web:1a07257f16030d77513162"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let currentUser = localStorage.getItem('techfix_user') || null;
        let usersDB = {};
        let threads = [];
        
        // Auto-provision admin user profile in Firestore if missing
        db.collection("users").doc("admin").get().then(doc => {
            if (!doc.exists) {
                db.collection("users").doc("admin").set({ email: "admin@techfix.com", role: 'admin', posts: 0, reactions: 0, points: 0, isLimited: false, avatar: '' });
            }
        });

        db.collection("users").onSnapshot((snapshot) => {
            usersDB = {};
            snapshot.forEach((doc) => {
                usersDB[doc.id] = doc.data();
            });
            updateAuthUI();
            if(document.getElementById('adminModal').classList.contains('active')) openAdminPanel();
            if(threads.length > 0) renderThreads();
        });

        db.collection("threads").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            threads = [];
            snapshot.forEach((doc) => {
                threads.push({ id: doc.id, ...doc.data() });
            });
            renderThreads();
        });

        const roleConfig = {
            'new': { title: 'New', class: 'role-new' },
            'member': { title: 'Member', class: 'role-member' },
            'elite': { title: 'Elite', class: 'role-elite' },
            'contributor': { title: 'Contributor', class: 'role-contributor' },
            'admin': { title: 'Administrator', class: 'role-admin' }
        };

        function getUser(username) { return usersDB[username] || { role: 'new', posts: 0, reactions: 0, points: 0, isLimited: false }; }
        function hasPerms(role, requiredLevel) {
            const levels = ['new', 'member', 'elite', 'contributor', 'admin'];
            return levels.indexOf(role) >= levels.indexOf(requiredLevel);
        }

        function toggleSideNav() {
            document.getElementById('sideNav').classList.toggle('active');
            document.getElementById('sideNavOverlay').classList.toggle('active');
        }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        let isLoginMode = true;
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'Log In' : 'Register';
            document.getElementById('authBtn').innerText = isLoginMode ? 'Log In' : 'Register Account';
            document.getElementById('usernameGroup').style.display = isLoginMode ? 'none' : 'block';
        }
        
        function openAuth() { closeModals(); document.getElementById('authModal').classList.add('active'); }
        
        async function submitAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPass').value;
            const user = document.getElementById('authUser').value.trim().toLowerCase();

            if(!email || !pass) return alert('Please enter your email and password.');
            if(!isLoginMode && !user) return alert('Please choose a username to register.');

            try {
                if (isLoginMode) {
                    try {
                        await auth.signInWithEmailAndPassword(email, pass);
                    } catch(err) {
                        // Special auto-fix if trying to log in as default admin but auth doesn't exist yet
                        if (email === "admin@techfix.com" && pass === "admin") {
                            await auth.createUserWithEmailAndPassword(email, pass);
                            await db.collection("users").doc("admin").set({ email: email, role: 'admin', posts: 0, reactions: 0, points: 0, isLimited: false, avatar: '' }, { merge: true });
                            await auth.signInWithEmailAndPassword(email, pass);
                        } else {
                            throw err;
                        }
                    }

                    const snapshot = await db.collection("users").where("email", "==", email).get();
                    if(!snapshot.empty) {
                        currentUser = snapshot.docs[0].id;
                        localStorage.setItem('techfix_user', currentUser);
                    } else {
                        // Fallback if doc ID lookup fails
                        currentUser = email === "admin@techfix.com" ? "admin" : email.split('@')[0];
                        localStorage.setItem('techfix_user', currentUser);
                    }
                } else {
                    const userRef = db.collection("users").doc(user);
                    const doc = await userRef.get();
                    if(doc.exists) return alert('Username already taken.');

                    await auth.createUserWithEmailAndPassword(email, pass);
                    await userRef.set({ 
                        email: email, role: 'new', posts: 0, reactions: 0, points: 0, isLimited: false, avatar: '' 
                    });
                    
                    currentUser = user; 
                    localStorage.setItem('techfix_user', currentUser);
                    alert('Registered successfully!');
                }
                
                document.getElementById('authEmail').value = '';
                document.getElementById('authUser').value = '';
                document.getElementById('authPass').value = '';
                closeModals(); updateAuthUI(); renderThreads();
            } catch(error) {
                console.error("Auth error", error);
                alert("Error: " + error.message); 
            }
        }

        async function logout() {
            await auth.signOut();
            currentUser = null; localStorage.removeItem('techfix_user');
            closeModals(); updateAuthUI(); renderThreads();
        }

        function updateAuthUI() {
            const authDiv = document.getElementById('auth-controls');
            const loungeNav = document.getElementById('eliteLoungeNav');
            const adminNav = document.getElementById('adminPanelNav');
            
            loungeNav.style.display = 'none';
            adminNav.style.display = 'none';

            if(currentUser && usersDB[currentUser]) {
                const u = getUser(currentUser);
                const rConf = roleConfig[u.role] || roleConfig['new'];
                authDiv.innerHTML = `<div class="user-menu-trigger ${rConf.class}" onclick="openProfile()">@${currentUser}</div>`;
                
                if(hasPerms(u.role, 'elite')) loungeNav.style.display = 'block';
                if(u.role === 'admin') adminNav.style.display = 'block';
            } else {
                authDiv.innerHTML = `<button onclick="openAuth()">Log In / Register</button>`;
            }
        }

        function openProfile() {
            if(!currentUser) return;
            const u = getUser(currentUser);
            const rConf = roleConfig[u.role] || roleConfig['new'];
            
            const avDiv = document.getElementById('upcAvatar');
            if(u.avatar) {
                avDiv.style.backgroundImage = `url(${u.avatar})`;
                avDiv.innerText = '';
            } else {
                avDiv.style.backgroundImage = 'none';
                avDiv.innerText = currentUser.charAt(0).toUpperCase();
            }

            if(hasPerms(u.role, 'member')) {
                avDiv.classList.add('clickable');
                avDiv.onclick = () => document.getElementById('avatarUpload').click();
            } else {
                avDiv.classList.remove('clickable');
                avDiv.onclick = null;
            }

            document.getElementById('upcName').className = `upc-name ${rConf.class}`;
            document.getElementById('upcName').innerText = currentUser;
            document.getElementById('upcRole').innerText = rConf.title;
            
            document.getElementById('statPosts').innerText = u.posts || 0;
            document.getElementById('statReacts').innerText = u.reactions || 0;
            document.getElementById('statPoints').innerText = u.points || 0;
            
            document.getElementById('newUsernameInput').value = currentUser;
            document.getElementById('newPasswordInput').value = '';

            closeModals();
            document.getElementById('profileModal').classList.add('active');
        }

        async function handleAvatarUpload(e) {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 1048576) return alert("Image too large (Max 1MB).");
            
            const reader = new FileReader();
            reader.onload = async function(event) {
                await db.collection("users").doc(currentUser).update({ avatar: event.target.result });
                openProfile(); 
            };
            reader.readAsDataURL(file);
        }

        async function updateUsername() {
            const newName = document.getElementById('newUsernameInput').value.trim().toLowerCase();
            if(!newName || newName === currentUser) return alert("Enter a different username.");
            
            const checkDoc = await db.collection("users").doc(newName).get();
            if(checkDoc.exists) return alert("That username is already taken.");

            try {
                const oldData = usersDB[currentUser];
                // Create new doc, delete old doc
                await db.collection("users").doc(newName).set(oldData);
                await db.collection("users").doc(currentUser).delete();
                
                currentUser = newName;
                localStorage.setItem('techfix_user', currentUser);
                alert("Username updated successfully!");
                openProfile();
            } catch(e) {
                alert("Error updating username: " + e.message);
            }
        }

        async function updatePassword() {
            const newPass = document.getElementById('newPasswordInput').value;
            if(!newPass || newPass.length < 6) return alert("Password must be at least 6 characters.");
            
            try {
                const userObj = auth.currentUser;
                if(!userObj) return alert("No active authenticated session.");
                await userObj.updatePassword(newPass);
                alert("Password updated successfully!");
                document.getElementById('newPasswordInput').value = '';
            } catch(e) {
                alert("Error updating password: " + e.message + "\n(Note: You may need to log out and log back in before updating security credentials).");
            }
        }

        function openNewThread(editId = null) {
            if(!currentUser) return openAuth();
            if(getUser(currentUser).isLimited) return alert("Your account is restricted from posting.");
            
            const u = getUser(currentUser);
            const isEditing = editId !== null;
            
            document.getElementById('threadModalTitle').innerText = isEditing ? 'Edit Thread' : 'Create Thread';
            document.getElementById('editThreadId').value = isEditing ? editId : '';
            
            if (isEditing) {
                const t = threads.find(x => x.id === editId);
                document.getElementById('postTitle').value = t.title;
                document.getElementById('postContent').value = t.content;
                document.getElementById('checkSpoiler').checked = t.isSpoiler;
                document.getElementById('checkReaction').checked = t.requireReaction;
            } else {
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('checkSpoiler').checked = false;
                document.getElementById('checkReaction').checked = false;
            }

            document.getElementById('advancedOptions').style.display = hasPerms(u.role, 'member') ? 'block' : 'none';
            closeModals();
            document.getElementById('threadModal').classList.add('active');
        }

        async function submitThread() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const editId = document.getElementById('editThreadId').value;
            const isSpoiler = document.getElementById('checkSpoiler').checked;
            const requireReaction = document.getElementById('checkReaction').checked;

            if(!title || !content) return alert('Fill out all fields.');

            try {
                if (editId) {
                    await db.collection("threads").doc(editId).update({
                        title: title, content: content, isSpoiler: isSpoiler, requireReaction: requireReaction
                    });
                } else {
                    await db.collection("threads").add({
                        title: title, content: content, author: currentUser, 
                        date: new Date().toLocaleDateString(), timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        reactors: [], isSpoiler: isSpoiler, requireReaction: requireReaction
                    });
                    
                    await db.collection("users").doc(currentUser).update({
                        posts: firebase.firestore.FieldValue.increment(1), points: firebase.firestore.FieldValue.increment(2)
                    });
                }
                closeModals();
            } catch(e) {
                console.error("Error submitting thread", e);
            }
        }

        async function toggleReaction(threadId) {
            if(!currentUser) return openAuth();
            const t = threads.find(x => x.id === threadId);
            const threadRef = db.collection("threads").doc(threadId);
            const hasReacted = t.reactors && t.reactors.includes(currentUser);

            try {
                if(hasReacted) {
                    await threadRef.update({ reactors: firebase.firestore.FieldValue.arrayRemove(currentUser) });
                    if(t.author) {
                        await db.collection("users").doc(t.author).update({ reactions: firebase.firestore.FieldValue.increment(-1), points: firebase.firestore.FieldValue.increment(-1) });
                    }
                } else {
                    await threadRef.update({ reactors: firebase.firestore.FieldValue.arrayUnion(currentUser) });
                    if(t.author) {
                        await db.collection("users").doc(t.author).update({ reactions: firebase.firestore.FieldValue.increment(1), points: firebase.firestore.FieldValue.increment(1) });
                    }
                }
            } catch(e) { console.error("Error reacting", e); }
        }

        function renderThreads() {
            const list = document.getElementById('thread-list');
            const searchInput = document.getElementById('searchInput');
            if(!list) return;
            
            const searchVal = searchInput ? searchInput.value.toLowerCase() : '';
            const currentRole = currentUser ? getUser(currentUser).role : 'guest';
            
            list.innerHTML = '';
            const filtered = threads.filter(t => t.title.toLowerCase().includes(searchVal) || t.content.toLowerCase().includes(searchVal));

            if(filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:gray;">No discussions found.</div>';
                return;
            }

            filtered.forEach(t => {
                const authorData = getUser(t.author);
                const rConf = roleConfig[authorData.role] || roleConfig['new'];
                const hasReacted = currentUser && t.reactors && t.reactors.includes(currentUser);
                const isAuthor = currentUser === t.author;
                
                let displayContent = t.content.replace(/\n/g, '<br>');
                let canView = true;
                let blockReason = "";

                if(t.isSpoiler && !hasPerms(currentRole, 'member') && !isAuthor) {
                    canView = false;
                    blockReason = "⚠️ Spoiler Content: You must be a Member or higher to view.";
                }
                
                if(t.requireReaction && !hasReacted && !isAuthor && canView) {
                    canView = false;
                    blockReason = "🔒 Hidden Content: You must react to this post to view.";
                }

                if(!canView) {
                    displayContent = `<div class="hidden-block">${blockReason}</div>`;
                }

                let editBtn = '';
                if(isAuthor && hasPerms(currentRole, 'member')) {
                    editBtn = `<button class="btn-edit" onclick="openNewThread('${t.id}')">Edit</button>`;
                }

                const reactCount = t.reactors ? t.reactors.length : 0;
                const reactBtnClass = hasReacted ? 'btn-react reacted' : 'btn-react';

                list.innerHTML += `
                    <div class="card">
                        <h3 class="card-title">${t.title}</h3>
                        <div class="card-body">${displayContent}</div>
                        <div class="card-footer">
                            <div>
                                By <span class="${rConf.class}" style="font-weight:bold;">@${t.author}</span>
                                <span style="font-size:0.7rem; opacity:0.7;">(${rConf.title})</span>
                            </div>
                            <div>
                                <button class="${reactBtnClass}" onclick="toggleReaction('${t.id}')">
                                    ❤️ ${reactCount}
                                </button>
                                ${editBtn}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openAdminPanel() {
            if(!currentUser || getUser(currentUser).role !== 'admin') return;
            const list = document.getElementById('adminUserList');
            list.innerHTML = '';
            
            for(let user in usersDB) {
                if(user === 'admin') continue; 
                const u = usersDB[user];
                list.innerHTML += `
                    <div class="admin-user-row">
                        <div>
                            <strong class="${(roleConfig[u.role]||roleConfig['new']).class}">${user}</strong><br>
                            <small>Pts: ${u.points||0} | Posts: ${u.posts||0}</small>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <select onchange="changeRole('${user}', this.value)">
                                <option value="new" ${u.role==='new'?'selected':''}>New</option>
                                <option value="member" ${u.role==='member'?'selected':''}>Member</option>
                                <option value="elite" ${u.role==='elite'?'selected':''}>Elite</option>
                                <option value="contributor" ${u.role==='contributor'?'selected':''}>Contributor</option>
                                <option value="admin" ${u.role==='admin'?'selected':''}>Administrator</option>
                            </select>
                            <button class="btn-limit ${u.isLimited ? 'limited' : ''}" onclick="toggleLimit('${user}')">
                                ${u.isLimited ? 'Unlimit' : 'Limit'}
                            </button>
                        </div>
                    </div>
                `;
            }
            toggleSideNav();
            document.getElementById('adminModal').classList.add('active');
        }

        async function changeRole(username, newRole) {
            await db.collection("users").doc(username).update({ role: newRole });
        }

        async function toggleLimit(username) {
            const currentStatus = usersDB[username].isLimited;
            await db.collection("users").doc(username).update({ isLimited: !currentStatus });
        }
    </script>
</body>
</html>
